appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.0"
constraintlayout = "2.2.0"
okhttp = "4.12.0"
reactiveStreams = "1.0.4"
navigationFragment = "2.8.6"
navigationUi = "2.8.6"
typewriterTextviewVersion = "v1.3"
kotlin = "1.9.24"
